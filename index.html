<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#003A41" />

    <!-- Op het beginscherm zetten geeft een eigen icoon en opent zonder
         adresbalk. Scheelt in de keuken een strook scherm, en het opent als
         app in plaats van als website. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/app-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Bewust "black" en niet "black-translucent": dan houdt iOS ruimte vrij
         voor de klok in plaats van de pagina eronder door te laten lopen. Zonder
         die keuze valt de menuknop achter de statusbalk. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Zonnetje" />

    <title>Boskma Foodservice</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
