server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html nooit cachen, zodat een nieuwe versie direct doorkomt
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Alles met een hash in de naam mag lang gecacht worden
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Eén pagina-app: elk adres komt uit bij index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
